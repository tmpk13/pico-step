[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
# KiCad's pcbnew module is installed for the system Python only; the PCB
# tasks run under it rather than the project venv.
KICAD_PYTHON = "/usr/bin/python3"

[tasks.install]
description = "Install test dependencies into the project venv"
run = "uv pip install pytest"

[tasks.footprints]
description = "Generate project footprints into lib/pico-step.pretty"
run = "python tools/footprints.py"

[tasks.sch]
description = "Build tsch/ into pico-step.kicad_sch and its sheets, proven with kicad-cli (refuses to overwrite a schematic saved from KiCad)"
env = { TSCH = "{{env.TSCH | default(value='tsch')}}" }
run = "python tools/tsch_sch.py"

[tasks.sch-check]
description = "Check the tsch/ drawing for format and connection errors without KiCad"
env = { TSCH = "{{env.TSCH | default(value='tsch')}}" }
run = "$TSCH check tsch/project.toml"

[tasks.render]
description = "Render each schematic sheet to build/tsch/pico-step-<sheet>.png"
env = { TSCH = "{{env.TSCH | default(value='tsch')}}" }
run = "$TSCH render tsch/project.toml -o build/tsch"

[tasks.erc]
description = "Run KiCad ERC on the schematic with the project's rule severities"
depends = ["sch"]
run = "kicad-cli sch erc --severity-error --exit-code-violations -o build/erc.rpt pico-step.kicad_sch"

[tasks.test]
description = "Run tests"
depends = ["sch"]
run = "pytest -q --tb=short tests"

[tasks.pcb-place]
description = "Apply the placement table in tools/pcb_place.py to pico-step.kicad_pcb (overwrites GUI moves)"
run = "$KICAD_PYTHON tools/pcb_place.py"

[tasks.pcb-sync]
description = "Update the board from the schematic (footprints, values, fields, nets), keeping the placement"
depends = ["sch"]
run = "$KICAD_PYTHON tools/pcb_sync.py"

[tasks.pcb-fill]
description = "Refill the copper zones of pico-step.kicad_pcb"
run = "$KICAD_PYTHON tools/pcb_fill.py"

[tasks.pcb-dsn]
description = "Export build/pico-step.dsn for freerouting"
run = "$KICAD_PYTHON tools/pcb_dsn.py"

[tasks.pcb-autoroute]
description = "Route build/pico-step.dsn with freerouting into build/pico-step.ses (FREEROUTING points at the launcher or jar)"
env = { FREEROUTING = "{{env.FREEROUTING | default(value='freerouting')}}" }
# Freerouting 2.1 pops a modal profile dialog after routing while its
# profile email is empty and then never writes the session file.
run = [
    "python3 tools/freerouting_profile.py",
    "$FREEROUTING -de build/pico-step.dsn -do build/pico-step.ses -mp 30 -da -dl",
]

[tasks.pcb-ses]
description = "Import build/pico-step.ses into the board and refill the zones"
run = ["$KICAD_PYTHON tools/pcb_ses.py build/pico-step.ses", "$KICAD_PYTHON tools/pcb_fill.py"]

[tasks.pcb-gnd]
description = "GND stitching: via grid, vias at pads the pour misses, prune dangling ones (needs build/drc.json from pcb-drc-json)"
run = [
    "$KICAD_PYTHON tools/pcb_gnd_vias.py grid",
    "$KICAD_PYTHON tools/pcb_fill.py",
    "kicad-cli pcb drc -o build/drc.json --format json --severity-all pico-step.kicad_pcb",
    "$KICAD_PYTHON tools/pcb_gnd_vias.py pads build/drc.json",
    "$KICAD_PYTHON tools/pcb_fill.py",
    "kicad-cli pcb drc -o build/drc.json --format json --severity-all pico-step.kicad_pcb",
    "$KICAD_PYTHON tools/pcb_gnd_vias.py prune build/drc.json",
    "$KICAD_PYTHON tools/pcb_fill.py",
]

[tasks.pcb-drc-json]
description = "Run KiCad DRC with every severity into build/drc.json"
run = "kicad-cli pcb drc -o build/drc.json --format json --severity-all pico-step.kicad_pcb"

[tasks.pcb-drc]
description = "Run KiCad DRC on the board"
run = "kicad-cli pcb drc --severity-error --exit-code-violations -o build/drc.rpt pico-step.kicad_pcb"

[tasks.pcb-render]
description = "Render both sides of the board to build/pcb-top.png and build/pcb-bottom.png"
run = [
    "kicad-cli pcb export svg -o build/pcb-top.svg --layers Edge.Cuts,F.Cu,F.SilkS,F.Fab --page-size-mode 2 --exclude-drawing-sheet pico-step.kicad_pcb",
    "kicad-cli pcb export svg -o build/pcb-bottom.svg --layers Edge.Cuts,B.Cu,B.SilkS,B.Fab --page-size-mode 2 --exclude-drawing-sheet --mirror pico-step.kicad_pcb",
    "inkscape build/pcb-top.svg --export-type=png --export-filename=build/pcb-top.png --export-width=1500",
    "inkscape build/pcb-bottom.svg --export-type=png --export-filename=build/pcb-bottom.png --export-width=1500",
]

