[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install test dependencies into the project venv"
run = "uv pip install pytest"

[tasks.footprints]
description = "Generate project footprints into lib/pico-step.pretty"
run = "python tools/footprints.py"

[tasks.symbols]
description = "Generate project symbols into lib/pico-step.kicad_sym"
run = "python tools/symbols.py"

[tasks.sch]
description = "Generate build/pico-step.gen.kicad_sch from tools/circuit.py (the project schematic is hand-placed)"
depends = ["footprints", "symbols"]
# kicad-vis searches KICAD9_SYMBOL_DIR after its own KiCad 10 library.
env = { KICAD9_SYMBOL_DIR = "{{config_root}}/lib" }
run = [
    "mkdir -p build",
    "python tools/circuit.py > build/circuit.json",
    "kicad-vis layout build/circuit.json -o build/pico-step.gen.kicad_sch --json > build/layout.json",
    "python -c \"import json,sys;d=json.load(open('build/layout.json'));print('ok',d['ok'],d.get('stats'));sys.exit(0 if d['ok'] else 1)\"",
    "python ~/.claude/skills/kicad-schematic/fixjustify.py build/pico-step.gen.kicad_sch",
    "python tools/set_erc.py",
]

[tasks.parity]
description = "List nets that differ between pico-step.kicad_sch and tools/circuit.py"
run = "python tools/parity.py"

[tasks.render]
description = "Render the schematic to build/pico-step.png"
run = "kicad-vis render pico-step.kicad_sch -o build/pico-step.png"

[tasks.erc]
description = "Run KiCad ERC on the schematic"
run = "kicad-cli sch erc --severity-error --exit-code-violations -o build/erc.rpt pico-step.kicad_sch"

[tasks.test]
description = "Run tests"
run = "pytest -q --tb=short tests"

[tasks.pcb-place]
description = "Apply the placement table in tools/pcb_place.py to pico-step.kicad_pcb (overwrites GUI moves)"
run = "python3 tools/pcb_place.py"

[tasks.pcb-route]
description = "Pre-route the power stage and VM pour (removes all tracks first, run only before autorouting)"
run = "python3 tools/pcb_route.py"

[tasks.pcb-fill]
description = "Refill the copper zones of pico-step.kicad_pcb"
run = "python3 tools/pcb_fill.py"

[tasks.pcb-dsn]
description = "Export build/pico-step.dsn for freerouting"
run = "python3 tools/pcb_dsn.py"

[tasks.pcb-autoroute]
description = "Route build/pico-step.dsn with freerouting into build/pico-step.ses (FREEROUTING points at the launcher or jar)"
env = { FREEROUTING = "{{env.FREEROUTING | default(value='freerouting')}}" }
# Freerouting 2.1 pops a modal profile dialog after routing while its
# profile email is empty and then never writes the session file.
run = [
    "python3 tools/freerouting_profile.py",
    "$FREEROUTING -de build/pico-step.dsn -do build/pico-step.ses -mp 30 -da -dl",
]

[tasks.pcb-ses]
description = "Import build/pico-step.ses into the board and refill the zones"
run = ["python3 tools/pcb_ses.py build/pico-step.ses", "python3 tools/pcb_fill.py"]

[tasks.pcb-drc]
description = "Run KiCad DRC on the board"
run = "kicad-cli pcb drc --severity-error --exit-code-violations -o build/drc.rpt pico-step.kicad_pcb"

[tasks.pcb-render]
description = "Render both sides of the board to build/pcb-top.png and build/pcb-bottom.png"
run = [
    "kicad-cli pcb export svg -o build/pcb-top.svg --layers Edge.Cuts,F.Cu,F.SilkS,F.Fab --page-size-mode 2 --exclude-drawing-sheet pico-step.kicad_pcb",
    "kicad-cli pcb export svg -o build/pcb-bottom.svg --layers Edge.Cuts,B.Cu,B.SilkS,B.Fab --page-size-mode 2 --exclude-drawing-sheet --mirror pico-step.kicad_pcb",
    "inkscape build/pcb-top.svg --export-type=png --export-filename=build/pcb-top.png --export-width=1500",
    "inkscape build/pcb-bottom.svg --export-type=png --export-filename=build/pcb-bottom.png --export-width=1500",
]
